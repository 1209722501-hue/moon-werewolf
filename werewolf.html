<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影狼人杀</title><style>
:root{--bg:#0b1020;--panel:#131b32;--panel2:#1a2542;--text:#edf2ff;--muted:#9aa8c7;--accent:#8b5cf6;--gold:#f4c95d;--danger:#ef6b73;--ok:#58d49b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#202b59 0,#0b1020 45%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,"Microsoft YaHei",sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.moon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#fff0a6,#c3a4ff);box-shadow:0 0 28px #9b7cff88}.brand h1{font-size:24px;margin:0}.brand small{color:var(--muted)}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);box-shadow:0 8px 20px #0003}button.alt{background:#2a365b}button.ghost{background:transparent;border:1px solid #3b4a75}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:linear-gradient(180deg,#182343ee,#10182dee);border:1px solid #2b3962;border-radius:20px;padding:22px;box-shadow:0 18px 40px #0003}.hero{padding:30px;min-height:300px;display:flex;flex-direction:column;justify-content:center}.hero h2{font-size:40px;line-height:1.1;margin:0 0 10px}.hero p{color:var(--muted);max-width:560px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.roomline{display:flex;gap:10px;margin:12px 0}.roomline input{flex:1;min-width:0}.input{background:#0c1429;border:1px solid #334267;color:#fff;padding:12px 13px;border-radius:10px;font-size:16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h3{margin:0}.badge{background:#2a365b;color:#cbd5ff;padding:5px 9px;border-radius:999px;font-size:13px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.player{display:flex;justify-content:space-between;align-items:center;background:#111a32;border:1px solid #29375e;border-radius:12px;padding:11px 13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:7px}.muted{color:var(--muted)}.hidden{display:none}.phase{font-size:13px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}.big{font-size:30px;margin:8px 0}.role{font-size:42px;font-weight:800;margin:10px 0;color:#fff0a6}.night{background:linear-gradient(135deg,#121932,#312257)}.day{background:linear-gradient(135deg,#25365f,#243f55)}.log{max-height:230px;overflow:auto;display:grid;gap:8px}.log div{padding:9px 11px;border-radius:10px;background:#0e172d;color:#bac6e3;font-size:14px}.votegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.vote{background:#202d51;border:1px solid #3a4e83;text-align:left}.vote.selected{outline:2px solid var(--gold)}.footer{color:#7280a2;text-align:center;font-size:13px;margin-top:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h2{font-size:32px}.players,.votegrid{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}
</style><style>
/* 狼人杀增强模块：追加到现有页面即可 */
.wl-app{max-width:1100px;margin:0 auto;padding:24px;color:#edf2ff}.wl-panel{background:#121c36;border:1px solid #31436f;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 14px 32px #0004}.wl-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.wl-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.wl-players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wl-player{padding:12px;border:1px solid #33456f;border-radius:12px;background:#0d1730;cursor:pointer}.wl-player.dead{opacity:.45;text-decoration:line-through}.wl-player.target{outline:2px solid #f4c95d}.wl-btn{background:#8059ed;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.wl-btn.secondary{background:#293a62}.wl-input{background:#0b142b;color:#fff;border:1px solid #394c79;border-radius:9px;padding:10px}.wl-log{max-height:230px;overflow:auto}.wl-log div{padding:7px 0;border-bottom:1px solid #27385e;color:#b9c6e5}.wl-day{background:linear-gradient(135deg,#203b61,#263f55)}.wl-night{background:linear-gradient(135deg,#15182f,#372254)}.wl-role{font-size:28px;color:#ffe9a0;font-weight:800}.wl-hide{display:none!important}@media(max-width:760px){.wl-grid{grid-template-columns:1fr}.wl-players{grid-template-columns:1fr}}

</style></head><body><main class="wrap"><div class="top"><div class="brand"><div class="moon"></div><div><h1>月影狼人杀</h1><small>一局只需要一个房间码</small></div></div><button class="ghost" id="reset">重置演示</button></div>
<section id="lobby" class="grid"><div class="card hero"><div class="phase">ONLINE WEREWOLF</div><h2>今晚，谁在说谎？</h2><p>创建一个房间，邀请朋友输入房间码加入。房主开始后，游戏会自动分配身份并推进夜晚、白天与投票阶段。</p><div class="actions"><label class="muted" style="display:flex;align-items:center;gap:8px">人数<select class="input" id="countSelect"><option value="5">5 人</option><option value="6">6 人</option><option value="7">7 人</option><option value="8" selected>8 人</option></select></label><button id="create">创建房间</button><button class="alt" id="quick">快速体验</button></div><div class="roomline"><input class="input" id="codeInput" placeholder="输入房间码"><button class="alt" id="join">加入房间</button></div><div id="notice" class="muted"></div></div><div class="card"><div class="section-title"><h3>房间预览</h3><span class="badge" id="roomBadge">未连接</span></div><div class="muted" id="roleHint">5–8 人自由选择，角色会自动匹配</div><div class="players" id="lobbyPlayers" style="margin-top:16px"></div></div></section>
<section id="game" class="hidden"><div class="grid"><div class="card" id="phaseCard"><div class="phase" id="phaseLabel">NIGHT 1</div><div class="big" id="phaseTitle">夜幕降临</div><p id="phaseText" class="muted"></p><div id="roleBox"></div><div id="gameActions" class="actions"></div></div><div class="card"><div class="section-title"><h3>存活玩家</h3><span class="badge" id="aliveCount"></span></div><div class="players" id="gamePlayers"></div></div></div><div class="card" style="margin-top:18px"><div class="section-title"><h3>房间记录</h3><span class="muted">实时同步</span></div><div class="log" id="log"></div></div></section><div class="footer">月影狼人杀 · 浏览器演示版</div></main>
<script>
const names=['你','阿青','小满','北辰','七七','老K','木木','阿洛'];const roleSets={5:['狼人','预言家','女巫','平民','平民'],6:['狼人','狼人','预言家','女巫','平民','平民'],7:['狼人','狼人','预言家','女巫','猎人','平民','平民'],8:['狼人','狼人','预言家','女巫','猎人','平民','平民','平民']};let state={room:null,players:[],phase:'lobby',night:1,alive:[],role:'',roles:[],selected:null,logs:[]};
const $=id=>document.getElementById(id);function log(t){state.logs.unshift(t);renderLog()}function renderLog(){$('log').innerHTML=state.logs.map(x=>`<div>${x}</div>`).join('')};function lobby(){ $('lobbyPlayers').innerHTML=state.players.map((p,i)=>`<div class="player"><span><i class="dot"></i>${p}</span><span class="muted">${i===0?'房主':'已准备'}</span></div>`).join(''); $('roomBadge').textContent=state.room?`房间 ${state.room}`:'未连接'}
function renderGame(){ $('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('aliveCount').textContent=`${state.alive.length} 人存活`; $('gamePlayers').innerHTML=state.players.map((p,i)=>`<div class="player"><span>${state.alive.includes(i)?'<i class="dot"></i>':'☠️ '}${p}</span><span class="muted">${state.alive.includes(i)?'存活':'出局'}</span></div>`).join('');$('phaseLabel').textContent=state.phase==='night'?`NIGHT ${state.night}`:'DAY';$('phaseTitle').textContent=state.phase==='night'?'夜幕降临':'天亮了';$('phaseText').textContent=state.phase==='night'?'请查看你的身份，并完成今晚行动。白天再公开讨论。':'讨论刚刚发生的事情，然后投票放逐一名玩家。'; $('phaseCard').className=`card ${state.phase}`; $('roleBox').innerHTML=state.phase==='night'?`<div class="role">${state.role}</div><div class="muted">你的身份仅自己可见</div>`:'';let acts='';if(state.phase==='night'){acts='<button id="nightAct">完成夜间行动</button>'}else{acts='<div class="votegrid">'+state.players.map((p,i)=>state.alive.includes(i)&&i!==0?`<button class="vote ${state.selected===i?'selected':''}" onclick="selectVote(${i})">投票给 ${p}</button>`:'').join('')+'</div><button class="alt" id="voteAct">确认投票</button>'}$('gameActions').innerHTML=acts;if($('nightAct'))$('nightAct').onclick=()=>{log(`第 ${state.night} 夜结束，天亮后所有人睁眼。`);state.phase='day';renderGame()};if($('voteAct'))$('voteAct').onclick=()=>{if(state.selected==null)return alert('先选择一名玩家');let out=state.selected;state.alive=state.alive.filter(i=>i!==out);log(`白天投票结束：${state.players[out]} 被放逐。`);state.selected=null;if(state.alive.length<=4){log('游戏演示结束：好人阵营获得胜利！');$('gameActions').innerHTML='<button onclick="location.reload()">再来一局</button>'}else{state.night++;state.phase='night';state.role='狼人';renderGame()}};renderLog()}
window.selectVote=i=>{state.selected=i;renderGame()};function start(){let count=Number($('countSelect').value);state.room=Math.random().toString(36).slice(2,8).toUpperCase();state.players=[...names.slice(0,count)];state.alive=state.players.map((_,i)=>i);state.roles=[...roleSets[count]].sort(()=>Math.random()-.5);state.role=state.roles[0];$('notice').textContent=`房间已创建：${state.room} · ${count} 人局`;$('roleHint').textContent=`${count} 人配置已加载`;lobby();log(`房间 ${state.room} 已创建，${count} 人局，角色已自动分配。`)}$('create').onclick=start;$('quick').onclick=()=>{start();setTimeout(()=>{state.phase='night';renderGame()},100)};$('join').onclick=()=>{let c=$('codeInput').value.trim().toUpperCase();if(!c)return alert('请输入房间码');state.room=c;let count=Number(countSelect.value);state.players=[...names.slice(0,Math.max(4,count-1)),'新玩家'].slice(0,count);state.alive=state.players.map((_,i)=>i);$('notice').textContent=`已加入房间 ${c}`;lobby()};$('reset').onclick=()=>location.reload();document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('codeInput')===document.activeElement)$('join').click()});lobby();
</script><script>
(()=>{const id=Math.random().toString(36).slice(2,10), name='玩家'+id.slice(0,3);let socket;function connect(){socket=new WebSocket(`ws://${location.hostname||'localhost'}:8787`);socket.onopen=()=>{$('notice').textContent='已连接联机服务器'};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error')return alert(m.message);if(m.type==='room'){const x=m.state;state.room=x.code;state.players=x.players.map(p=>p.name);state.alive=x.players.map((p,i)=>p.alive?i:null).filter(i=>i!==null);$('roomBadge').textContent=`房间 ${x.code}`;lobby();if(x.players.length===x.count&&x.players[0].id===id){let b=document.getElementById('onlineStart');if(!b){b=document.createElement('button');b.id='onlineStart';b.textContent='开始游戏';b.onclick=()=>socket.send(JSON.stringify({type:'start',id}));$('gameActions').appendChild(b)}}}if(m.type==='started'){state.phase='night';state.players=m.state.players.map(p=>p.name);state.alive=m.state.players.map((p,i)=>p.alive?i:null).filter(i=>i!==null);state.role=m.roleById[id]||'平民';renderGame()}};socket.onclose=()=>{$('notice').textContent='联机服务器已断开'}}function send(type,data){if(!socket||socket.readyState!==1)return alert('尚未连接服务器');socket.send(JSON.stringify({type,id,name,...data}))}connect();$('create').onclick=()=>send('create',{count:Number($('countSelect').value)});$('join').onclick=()=>{let c=$('codeInput').value.trim().toUpperCase();if(c)send('join',{code:c,count:Number($('countSelect').value)})}})();
</script><script>
/* 狼人杀增强模块：中文注释版；本地单页面模拟，不依赖后端 */
(()=>{
  const $=s=>document.querySelector(s), roles={5:['狼人','狼人','预言家','平民','平民'],6:['狼人','狼人','预言家','女巫','平民','平民'],7:['狼人','狼人','预言家','女巫','平民','平民','平民'],8:['狼人','狼人','狼人','预言家','女巫','猎人','平民','平民']};
  const names=['你','阿青','小满','北辰','七七','老K','木木','阿洛']; let s={n:8,ps:[],phase:'lobby',night:0,idx:0,target:null,witchSave:true,witchPoison:true,logs:[],lastWolf:null,firstDeath:true,words:false,voiceLocked:true};
  function shuffle(a){return [...a].sort(()=>Math.random()-.5)} function add(t){s.logs.unshift(t);render()}
  function build(){document.querySelectorAll('#lobby,#game,.footer').forEach(x=>x.classList.add('wl-hide'));const el=document.createElement('section');el.id='wlApp';el.className='wl-app';el.innerHTML=`<div class="wl-panel"><h2>月影狼人杀 · 本地完整模式</h2><div id="wlSetup"><div class="wl-toolbar"><label>人数 <select id="wlCount" class="wl-input"><option>5</option><option>6</option><option selected>8</option></select></label><label><input id="wlSelfSave" type="checkbox"> 女巫首夜可自救</label><label><input id="wlHunterNight" type="checkbox"> 猎人首夜可开枪</label><button class="wl-btn" id="wlStart">创建并开始</button></div></div><div id="wlGame" class="wl-hide"></div></div>`;document.querySelector('main.wrap').append(el);$('#wlStart').onclick=start}
  function start(){s.n=+$('#wlCount').value;s.witchSave=$('#wlSelfSave').checked;s.ps=names.slice(0,s.n).map((name,i)=>({id:i,name,alive:true,role:null,mayVote:true}));const rr=shuffle(roles[s.n]);s.ps.forEach((p,i)=>p.role=rr[i]);s.phase='wolf';s.night=1;s.logs=[];add(`第1夜开始。身份已经秘密分配。`)}
  function alive(){return s.ps.filter(p=>p.alive)} function winner(){const w=alive().filter(p=>p.role==='狼人').length,g=alive().filter(p=>p.role!=='狼人').length;if(!w){s.phase='end';add('好人阵营胜利！')}else if(w>=g){s.phase='end';add('狼人阵营胜利！')}return s.phase==='end'}
  function render(){const box=$('#wlGame');if(!box)return;const aliveHtml=s.ps.map(p=>`<div class="wl-player ${p.alive?'':'dead'} ${s.target===p.id?'target':''}" data-id="${p.id}"><b>${p.name}</b><span>${p.alive?'存活':'出局'}${p.id===0?' · 你':''}${s.phase==='end'?' · '+p.role:''}</span></div>`).join('');let body='';if(s.phase==='wolf')body=`<div class="wl-role">你的身份：${s.ps[0].role}</div><p>狼人私密讨论，限时 60 秒；未轮到你时麦克风锁定。</p><button class="wl-btn secondary" disabled>🎙 麦克风锁定</button><button class="wl-btn" id="wlConfirm">确认狼人行动</button>`;else if(s.phase==='seer')body=`<div class="wl-role">预言家行动</div><p>点击玩家查验身份。</p><button class="wl-btn" id="wlConfirm">确认查验并进入女巫阶段</button>`;else if(s.phase==='witch')body=`<div class="wl-role">女巫行动</div><p>${s.lastWolf!=null&&s.witchSave?'今晚死亡：'+s.ps[s.lastWolf].name:'解药已用，无法得知今晚死者'}</p><button class="wl-btn" id="wlConfirm">确认女巫行动</button>`;else if(s.phase==='day')body=`<h3>第 ${s.night} 天 · 自由发言</h3><p>${s.firstDeath?'首日死亡玩家拥有 60 秒遗言。':'按顺序发言，未到发言时间不得使用麦克风。'}</p><button class="wl-btn secondary" disabled>🎙 麦克风锁定</button><button class="wl-btn" id="wlConfirm">进入投票</button>`;else if(s.phase==='vote')body=`<h3>投票处决</h3><p>死亡玩家可以观战或退出，但不能发言。</p><button class="wl-btn" id="wlConfirm">确认投票</button>`;else if(s.phase==='end')body=`<h2>游戏结束</h2><p>头像旁已显示所有玩家身份。</p><button class="wl-btn" id="wlReset">再来一局</button>`;box.innerHTML=`<div class="wl-grid"><div><div class="wl-panel ${s.phase==='day'||s.phase==='vote'?'wl-day':'wl-night'}"><small>第 ${s.night} 天 · ${s.phase==='day'||s.phase==='vote'?'白天':'夜晚'} · 当前行动：${s.phase}</small>${body}</div><div class="wl-panel"><h3>玩家</h3><div class="wl-players">${aliveHtml}</div></div></div><div class="wl-panel"><h3>游戏日志</h3><div class="wl-log">${s.logs.map(x=>`<div>${x}</div>`).join('')}</div></div></div>`;box.querySelectorAll('.wl-player').forEach(x=>x.onclick=()=>{s.target=+x.dataset.id;render()});const c=$('#wlConfirm');if(c)c.onclick=advance;const r=$('#wlReset');if(r)r.onclick=()=>{s.phase='lobby';$('#wlGame').classList.add('wl-hide');$('#wlSetup').classList.remove('wl-hide')}}
  function advance(){if(s.phase==='wolf'){if(s.target==null)s.target=alive().find(p=>p.role!=='狼人')?.id; s.lastWolf=s.target;s.phase='seer';add(`狼人选择了目标。`)}else if(s.phase==='seer'){if(s.target!=null)add(`预言家查验：${s.ps[s.target].name} 是${s.ps[s.target].role==='狼人'?'狼人':'好人'}。`);s.phase='witch'}else if(s.phase==='witch'){if(s.lastWolf!=null&&s.ps[s.lastWolf].alive){s.ps[s.lastWolf].alive=false;add(`天亮：${s.ps[s.lastWolf].name} 被狼人击杀。`)}s.phase='day'}else if(s.phase==='day'){s.phase='vote'}else if(s.phase==='vote'){if(s.target!=null&&s.ps[s.target].alive){s.ps[s.target].alive=false;add(`投票结束：${s.ps[s.target].name} 被放逐。`)}s.target=null;if(!winner()){s.night++;s.phase='wolf';add(`第${s.night}夜开始。`)}}render()}
  build();render();
})();


</script></body></html>
