<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影狼人杀</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:16px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:24px}section{background:#18213b;border:1px solid #374566;border-radius:18px;padding:20px;margin:16px 0}button,input,select{font:inherit;padding:10px;margin:5px;border-radius:9px;border:1px solid #556080}button{background:#7653d7;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}.players{display:flex;flex-wrap:wrap;gap:12px}.players button{min-width:135px}.day{background:#203d59}.dead{opacity:.55}#notice{color:#ffd886}label{display:inline-block;margin:6px}pre{white-space:pre-wrap}dialog{background:#18213b;color:white;border-radius:16px}#timer{color:#ffda7b}</style><main><h1>月影狼人杀</h1><p id="notice" role="status">正在连接…</p><div id="setup"><section><label>昵称<input id="name" maxlength="24" value="玩家"></label><label>人数<select id="count"><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label><input id="selfSave" type="checkbox">女巫首夜可自救</label><label><input id="hunterFirst" type="checkbox">猎人首夜可开枪</label><button id="create">创建房间</button><input id="code" placeholder="房间号"><button id="join">加入房间</button></section></div><section><button id="mic">授权麦克风</button><span id="voiceStatus">麦克风关闭</span></section><div id="room"></div><dialog id="result"><h2 id="winner"></h2><div id="roles"></div><button onclick="this.closest('dialog').close()">继续查看</button></dialog></main><script src="werewolf-voice.js"></script><script src="client.js"></script></html>
